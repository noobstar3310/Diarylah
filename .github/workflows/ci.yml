name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede an in-flight run when new commits land on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    env:
      # `prisma generate`, `prisma validate` and `next build` never open a
      # database connection, but prisma.config.ts resolves DIRECT_URL at load
      # time and would throw on a missing variable. These are syntactically
      # valid placeholders, not credentials — CI has no database access.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/postgres
      DIRECT_URL: postgresql://ci:ci@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Runs the postinstall hook, which generates the Prisma client.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build
        run: npm run build
